name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: linux build, smoke and deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb

      - name: Checkout Mustela engine
        run: git clone --depth 1 --branch v0.25.1 https://github.com/mel0k1/Mustela.git ../Mustela

      - name: Build engine
        run: |
          cmake -S ../Mustela -B ../Mustela/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSTELA_BUILD_SHELL=OFF -DMUSTELA_BUILD_TESTS=OFF -DMUSTELA_BUILD_BENCH=OFF \
            -DMUSTELA_BUILD_VIEW=ON -DMUSTELA_WEBEXT_DIR=/usr/lib/mustela/webext
          cmake --build ../Mustela/build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke
        run: |
          set +e
          env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 xvfb-run -a timeout 120 ./build/kiwi --self-test
          code=$?
          set -e
          if [ -f "$HOME/.config/kiwi/kiwi.log" ]; then
            echo "kiwi smoke: GTK criticals during self-test:" >&2
            cat "$HOME/.config/kiwi/kiwi.log" >&2
          fi
          echo "kiwi smoke: self-test exit $code"
          exit "$code"

      - name: Package deb
        working-directory: build
        run: cpack -G DEB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-linux-${{ github.sha }}
          path: build/*.deb
          if-no-files-found: error

  windows:
    name: windows build on CEF and installer
    runs-on: windows-latest
    env:
      CEF_VERSION: 152.0.14+g8a0b5b9+chromium-152.0.7977.167
      CEF_SHA1: 0bad9c7d50f2fbf508bdf47e8f885590bb4d19ae
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CEF binary distribution
        shell: pwsh
        run: |
          $name = "cef_binary_$env:CEF_VERSION" + "_windows64_minimal.tar.bz2"
          $url = "https://cef-builds.spotifycdn.com/" + [uri]::EscapeDataString($name)
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile cef.tar.bz2
          $sha = (Get-FileHash cef.tar.bz2 -Algorithm SHA1).Hash.ToLower()
          if ($sha -ne $env:CEF_SHA1) { throw "CEF sha1 mismatch: $sha" }
          tar -xf cef.tar.bz2
          Move-Item "cef_binary_*_windows64_minimal" cef-dist
          Get-ChildItem cef-dist | Select-Object Name

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DKIWI_WITH_CEF=ON -DCEF_ROOT="${{ github.workspace }}/cef-dist"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bundle | Out-Null
          Get-ChildItem build/Release -Exclude "kiwi_start_page_tests.exe","kiwi.exp","kiwi.lib" |
            Copy-Item -Destination build/bundle -Recurse -Force
          Get-ChildItem build/bundle | Select-Object Name, Length

      - name: Smoke (self-test on real Windows)
        shell: pwsh
        run: |
          function Run-KiwiSelfTest([string]$Label) {
            Remove-Item "$env:LOCALAPPDATA\kiwi\startup.log","$env:LOCALAPPDATA\kiwi\crash.log" -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath build/bundle/kiwi.exe -ArgumentList "--self-test" -PassThru
            if (-not $p.WaitForExit(120000)) {
              $p.Kill()
              throw "kiwi self-test ($Label) timed out after 120s"
            }
            "kiwi self-test ($Label) exit code: $($p.ExitCode)"
            $startup = "$env:LOCALAPPDATA\kiwi\startup.log"
            if (Test-Path $startup) { Get-Content $startup | ForEach-Object { "startup: $_" } }
            $crash = "$env:LOCALAPPDATA\kiwi\crash.log"
            if (Test-Path $crash) {
              Get-Content $crash
              $ceflog = "$env:LOCALAPPDATA\kiwi\cef.log"
              if (Test-Path $ceflog) { Get-Content $ceflog -Tail 60 }
              return 2
            }
            if ($p.ExitCode -ne 0) { return $p.ExitCode }
            return 0
          }
          $code = Run-KiwiSelfTest "stock"
          if ($code -ne 0) {
            "stock run failed with $code, retrying with --disable-gpu"
            $env:KIWI_EXTRA_SWITCHES = "disable-gpu,disable-gpu-compositing"
            $code = Run-KiwiSelfTest "disable-gpu"
            if ($code -ne 0) {
              "still failing with $code, retrying with --no-sandbox"
              $env:KIWI_EXTRA_SWITCHES = "no-sandbox"
              $code = Run-KiwiSelfTest "no-sandbox"
              if ($code -ne 0) {
                throw "kiwi self-test failed with exit $code (gpu and sandbox bisects both failed)"
              }
              "WARNING: stock startup crashed but --no-sandbox passes — sandbox spawn related"
              return
            }
            "WARNING: stock startup crashed but --disable-gpu passes — GPU-process related; keep bisecting"
          }

      - name: Pack zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/bundle/* -DestinationPath build/kiwi-windows-x64.zip
          Get-Item build/kiwi-windows-x64.zip | Select-Object Name, Length

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          & $iscc "/DKiwiVersion=$ver" packaging/windows/kiwi.iss
          Get-Item build/kiwi-setup-x64.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-windows-${{ github.sha }}
          path: |
            build/kiwi-windows-x64.zip
            build/kiwi-setup-x64.exe
          if-no-files-found: error

  flatpak:
    name: flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: kiwi.flatpak
          manifest-path: packaging/flatpak/io.github.mel0k1.Kiwi.yml
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-flatpak-${{ github.sha }}
          path: kiwi.flatpak
          if-no-files-found: error

  release:
    name: attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Kiwi $TAG" --generate-notes
          find artifacts -type f -exec gh release upload "$TAG" {} --clobber \;
          gh release view "$TAG" --json assets --jq '.assets[].name'
