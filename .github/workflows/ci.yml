name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: linux build, smoke and deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb

      - name: Checkout Mustela engine
        run: git clone --depth 1 --branch v0.22.0 https://github.com/mel0k1/Mustela.git ../Mustela

      - name: Build engine
        run: |
          cmake -S ../Mustela -B ../Mustela/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSTELA_BUILD_SHELL=OFF -DMUSTELA_BUILD_TESTS=OFF -DMUSTELA_BUILD_BENCH=OFF \
            -DMUSTELA_BUILD_VIEW=ON -DMUSTELA_WEBEXT_DIR=/usr/lib/mustela/webext
          cmake --build ../Mustela/build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke
        run: |
          xvfb-run -a bash -c '
            env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 ./build/kiwi about:blank &
            pid=$!
            sleep 12
            if kill -0 $pid 2>/dev/null; then
              kill $pid
              echo "kiwi smoke: process ran and was stopped"
              exit 0
            fi
            wait $pid
            code=$?
            echo "kiwi smoke: exited early with $code"
            exit $code
          '

      - name: Package deb
        working-directory: build
        run: cpack -G DEB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-linux-${{ github.sha }}
          path: build/*.deb
          if-no-files-found: error

  flatpak:
    name: flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        uses: flatpak/flatpak-github-actions@v6.8
        with:
          bundle: kiwi.flatpak
          manifest-path: packaging/flatpak/io.github.mel0k1.Kiwi.yml
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-flatpak-${{ github.sha }}
          path: kiwi.flatpak
          if-no-files-found: error

  release:
    name: attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "Kiwi $TAG" --generate-notes || true
          find artifacts -type f -exec gh release upload "$TAG" {} --clobber \;
