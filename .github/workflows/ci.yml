name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: linux build, smoke and deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb

      - name: Checkout Mustela engine
        run: git clone --depth 1 --branch v0.24.0 https://github.com/mel0k1/Mustela.git ../Mustela

      - name: Build engine
        run: |
          cmake -S ../Mustela -B ../Mustela/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSTELA_BUILD_SHELL=OFF -DMUSTELA_BUILD_TESTS=OFF -DMUSTELA_BUILD_BENCH=OFF \
            -DMUSTELA_BUILD_VIEW=ON -DMUSTELA_WEBEXT_DIR=/usr/lib/mustela/webext
          cmake --build ../Mustela/build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke
        run: |
          xvfb-run -a bash -c '
            env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 ./build/kiwi about:blank &
            pid=$!
            sleep 12
            if kill -0 $pid 2>/dev/null; then
              kill $pid
              echo "kiwi smoke: process ran and was stopped"
              exit 0
            fi
            wait $pid
            code=$?
            echo "kiwi smoke: exited early with $code"
            exit $code
          '

      - name: Package deb
        working-directory: build
        run: cpack -G DEB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-linux-${{ github.sha }}
          path: build/*.deb
          if-no-files-found: error

  windows:
    name: windows build and portable zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libsoup3
            mingw-w64-x86_64-glib-networking

      - name: Checkout Mustela engine
        run: git clone --depth 1 --branch v0.24.2 https://github.com/mel0k1/Mustela.git ../Mustela

      - name: Fetch WebKit C API headers
        shell: pwsh
        run: python scripts/fetch-win-headers.py ../Mustela/scripts/win-headers.txt build/sdk/include

      - name: Assemble WinCairo runtime
        shell: pwsh
        run: ../Mustela/scripts/fetch-win-runtime.ps1 -Destination build/runtime

      - name: Link SDK against runtime DLLs
        run: |
          mkdir -p build/sdk/lib
          cp build/runtime/runtime/bin64/*.dll build/sdk/lib/
          ls build/sdk/lib | head

      - name: Build engine
        run: |
          sdk=$(cygpath -m "$GITHUB_WORKSPACE/build/sdk")
          cmake -S ../Mustela -B ../Mustela/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMUSTELA_BUILD_SHELL=OFF -DMUSTELA_BUILD_TESTS=OFF -DMUSTELA_BUILD_BENCH=OFF \
            -DMUSTELA_BUILD_VIEW=ON "-DMUSTELA_WEBKIT_SDK=$sdk"
          cmake --build ../Mustela/build

      - name: Configure
        run: |
          sdk=$(cygpath -m "$GITHUB_WORKSPACE/build/sdk")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DMUSTELA_WEBKIT_SDK=$sdk"

      - name: Build and test
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Bundle
        run: bash scripts/bundle-windows.sh

      - name: Smoke
        run: bash scripts/smoke-windows.sh

      - name: Pack zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/bundle/* -DestinationPath build/kiwi-windows-x64.zip
          Get-Item build/kiwi-windows-x64.zip | Select-Object Name, Length

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          & $iscc "/DKiwiVersion=$ver" packaging/windows/kiwi.iss
          Get-Item build/kiwi-setup-x64.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-windows-${{ github.sha }}
          path: |
            build/kiwi-windows-x64.zip
            build/kiwi-setup-x64.exe
          if-no-files-found: error

  flatpak:
    name: flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: kiwi.flatpak
          manifest-path: packaging/flatpak/io.github.mel0k1.Kiwi.yml
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-flatpak-${{ github.sha }}
          path: kiwi.flatpak
          if-no-files-found: error

  release:
    name: attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Kiwi $TAG" --generate-notes
          find artifacts -type f -exec gh release upload "$TAG" {} --clobber \;
          gh release view "$TAG" --json assets --jq '.assets[].name'
